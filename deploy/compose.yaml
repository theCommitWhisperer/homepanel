# HomePanel on a Linux box with Docker Engine (NOT Docker Desktop): Home Assistant Container +
# Mosquitto + HomePanel server.
#
#   `homepanel setup` (host type "Linux box with Docker") writes this file, mosquitto/ and a .env
#   into a folder of your choice and runs it. By hand:
#     1. copy this file + mosquitto/mosquitto.conf into a folder (keep the mosquitto/ subfolder)
#     2. create .env (see the variables below) and mosquitto/passwd:
#          echo "homepanel:<mqtt-password>" > mosquitto/passwd
#          docker run --rm -v "$PWD/mosquitto:/mosquitto/config" eclipse-mosquitto:2 mosquitto_passwd -U /mosquitto/config/passwd
#     3. docker compose up -d homeassistant mosquitto      → onboard HA at http://<this-box>:8123
#     4. create a long-lived token in HA (Profile → Security), put it in .env as HA_TOKEN
#     5. docker compose up -d --build homepanel            → http://<this-box>:8080
#
# .env variables: TZ, HOMEPANEL_SRC (path to a HomePanel checkout; default: the parent of this
# folder, i.e. the repo root when used from deploy/), HA_TOKEN, MQTT_USER, MQTT_PASS, ADMIN_PASSWORD,
# AI_PROVIDER, AI_MODEL, AI_BASE_URL, AI_API_KEY (optional).

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host          # needed for mDNS/discovery; HA listens on :8123
    privileged: true            # USB sticks (ZBT-1) and Bluetooth
    stop_grace_period: 60s      # let HA write its database before stopping
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro  # Bluetooth
    # Alternative to privileged for just the ZBT-1:
    # devices:
    #   - /dev/serial/by-id/usb-Nabu_Casa_Home_Assistant_Connect_ZBT-1_XXXXXXXX-if00-port0:/dev/ttyUSB0

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./mosquitto:/mosquitto/config      # mosquitto.conf + passwd (hashed)
      - ./mosquitto-data:/mosquitto/data
      - ./mosquitto-log:/mosquitto/log

  homepanel:
    build:
      context: ${HOMEPANEL_SRC:-..}
      dockerfile: apps/server/Dockerfile
    image: homepanel:local
    container_name: homepanel
    restart: unless-stopped
    network_mode: host          # reaches HA + MQTT on 127.0.0.1, Wake-on-LAN broadcasts work; serves :8080
    depends_on:
      - homeassistant
      - mosquitto
    environment:
      TZ: ${TZ:-UTC}
      PORT: "8080"
      DATA_DIR: /data
      HA_URL: http://127.0.0.1:8123
      HA_TOKEN: ${HA_TOKEN:-}
      MQTT_URL: mqtt://127.0.0.1:1883
      MQTT_USER: ${MQTT_USER:-homepanel}
      MQTT_PASS: ${MQTT_PASS:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - ./homepanel-data:/data
