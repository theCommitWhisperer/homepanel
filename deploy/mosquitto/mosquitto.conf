# Mosquitto 2 for HomePanel. Logins are required; users live in /mosquitto/config/passwd
# (create with: mosquitto_passwd -c /mosquitto/config/passwd homepanel — or let `homepanel setup` do it).
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
