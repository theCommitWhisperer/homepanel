# Desk monitor next to the gaming PC (1920x1080-ish, landscape)
# Widget config keys: see apps/kiosk/src/widgets. Some widgets carry two spellings of a key
# (format/format24, interval/intervalSec) so they work with every kiosk build.
id: desk-monitor
name: Desk monitor
grid: { cols: 12, rows: 8 }
theme: dark
lite: false
idle:
  after: 10m
  show: clock
widgets:
  - id: clock
    type: clock
    at: [0, 0, 4, 2]
    format: 24h
    format24: true
    showDate: true

  - id: temps
    type: pc-temps
    title: Gaming PC
    at: [4, 0, 5, 4]
    pc: gaming-pc
    sensors: [cpu_package, cpu_core_max, gpu_core, gpu_hotspot, gpu_memory_junction, nvme0_temp, nvme1_temp]
    warnAt: 80
    critAt: 90
    style: gauges

  - id: drives
    type: pc-drives
    title: Drives
    at: [9, 0, 3, 4]
    pc: gaming-pc
    openActions:
      "C:": open-drive-c
      "D:": open-drive-d

  - id: lights
    type: lights
    title: Lights
    at: [0, 2, 4, 3]
    entities: [light.living_room, light.kitchen, light.desk_lamp]

  - id: pc-buttons
    type: buttons
    title: PC
    at: [4, 4, 5, 4]
    pc: gaming-pc

  - id: shortcuts
    type: buttons
    title: Shortcuts
    at: [0, 5, 4, 3]
    buttons:
      - label: Desk lamp
        icon: lamp
        action: { kind: ha, domain: light, service: toggle, data: { entity_id: light.desk_lamp } }
      - label: Wake PC
        icon: power
        action: { kind: wol, pc: gaming-pc }
      - label: Studio
        icon: "🎮"
        action: { kind: agent, pc: gaming-pc, action: launch-studio }
      - label: Headphones
        icon: "🎧"
        action: { kind: agent, pc: gaming-pc, action: audio-headphones }

  - id: gif
    type: media
    at: [9, 4, 3, 4]
    src: /media/homepanel.gif
    fit: contain
