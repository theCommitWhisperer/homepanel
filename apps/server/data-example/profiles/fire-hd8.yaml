# Fire HD 8 — low-power "lite" profile: no animations, slower sensor updates, snapshots instead of video
id: fire-hd8
name: Fire HD 8
grid: { cols: 4, rows: 6 }
theme: dark
lite: true
widgets:
  - id: clock
    type: clock
    at: [0, 0, 4, 2]
    format: 24h
    format24: true
    showDate: true

  - id: lights
    type: lights
    title: Lights
    at: [0, 2, 4, 2]
    entities: [light.living_room, light.kitchen, light.desk_lamp]

  - id: buttons
    type: buttons
    at: [0, 4, 4, 2]
    buttons:
      - label: All off
        icon: moon
        action: { kind: ha, domain: light, service: turn_off, data: { entity_id: [light.living_room, light.kitchen, light.desk_lamp] } }
      - label: Desk lamp
        icon: lamp
        action: { kind: ha, domain: light, service: toggle, data: { entity_id: light.desk_lamp } }
      - label: Lock PC
        icon: lock
        action: { kind: agent, pc: gaming-pc, action: lock }
      - label: PC sleep
        icon: moon
        action: { kind: agent, pc: gaming-pc, action: sleep }
        confirm: true
