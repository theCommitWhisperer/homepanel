# Kitchen iPad (portrait-ish)
id: kitchen-ipad
name: Kitchen iPad
grid: { cols: 6, rows: 8 }
theme: auto
lite: false
widgets:
  - id: clock
    type: clock
    at: [0, 0, 4, 2]
    format: 12h
    format24: false
    showDate: true

  - id: weather
    type: entity
    at: [4, 0, 2, 2]
    entity: weather.home
    label: Outside

  - id: lights
    type: lights
    title: Lights
    at: [0, 2, 3, 3]
    entities: [light.kitchen, light.living_room, light.desk_lamp]

  - id: front-door
    type: camera
    title: Front door
    at: [3, 2, 3, 3]
    entity: camera.front_door
    refreshSec: 5

  - id: buttons
    type: buttons
    at: [0, 5, 6, 2]
    buttons:
      - label: All lights off
        icon: moon
        action: { kind: ha, domain: light, service: turn_off, data: { entity_id: [light.living_room, light.kitchen, light.desk_lamp] } }
      - label: Kitchen
        icon: bulb
        action: { kind: ha, domain: light, service: toggle, data: { entity_id: light.kitchen } }
      - label: Play / Pause
        icon: "⏯️"
        action: { kind: agent, pc: gaming-pc, action: media-playpause }
      - label: Wake PC
        icon: power
        action: { kind: wol, pc: gaming-pc }

  - id: note
    type: text
    at: [0, 7, 6, 1]
    text: Bins go out Thursday night
    size: s
